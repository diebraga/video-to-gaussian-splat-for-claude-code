<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<title>Splat Viewer</title>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<style>
			body {
				overflow: hidden;
				margin: 0;
				height: 100vh;
				width: 100vw;
				font-family: sans-serif;
				background: black;
				text-shadow: 0 0 3px black;
			}
			a, body {
				color: white;
			}
			#info {
				z-index: 100;
				position: absolute;
				top: 10px;
				left: 15px;
				font-size: small;
			}
			.scene,
			#message {
				position: absolute;
				display: flex;
				top: 0;
				right: 0;
				left: 0;
				bottom: 0;
				z-index: 2;
				height: 100%;
				width: 100%;
				align-items: center;
				justify-content: center;
			}
			#message {
				font-weight: bold;
				font-size: large;
				color: red;
				pointer-events: none;
			}
			#progress {
				position: absolute;
				top: 0;
				height: 5px;
				background: blue;
				z-index: 99;
				transition: width 0.1s ease-in-out;
			}
			#fps {
				position: absolute;
				bottom: 10px;
				z-index: 999;
				right: 10px;
				font-size: small;
			}
			#canvas {
				display: block;
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				touch-action: none;
			}
			.spinner {
				width: 40px;
				height: 40px;
				border: 4px solid #444;
				border-top-color: #fff;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
		</style>
	</head>
	<body>
		<div id="info">Drag to orbit &middot; scroll to zoom &middot; drag a .ply here to load it</div>
		<div id="progress"></div>
		<div id="message"></div>
		<div class="scene" id="spinner"><div class="spinner"></div></div>
		<canvas id="canvas"></canvas>
		<div id="fps"></div>
		<script src="main.js"></script>
	</body>
</html>
